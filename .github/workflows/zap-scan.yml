# Security check: runs the free ZAP "baseline" scan against the live site.
# The baseline scan only looks; it doesn't attack or change anything.
# Run it any time from the repo's Actions tab: "ZAP security scan" > "Run workflow".
# Re-run 11 Oct 2026 after v21.4 (scripts moved out, CSP script-src without 'unsafe-inline').
# The last step posts the full details of any security-policy (CSP) warnings as a comment on the
# report issue, because the issue itself only lists what changed since the last run.
name: ZAP security scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zap-scan.yml'

permissions:
  contents: read
  issues: write

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Scan minifolio.app
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'https://minifolio.app/'
          issue_title: 'ZAP security scan report'
          allow_issue_writing: true
          fail_action: false
          artifact_name: 'zap_scan'

      - name: Post the security-policy (CSP) warning details on the report issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "CSP warning details from run ${{ github.run_id }}:"
            echo
            jq -r '.site[].alerts[] | select(.pluginid == "10055")
                   | "- **\(.name)**\n" + ([.instances[] | "  - \(.uri) | \(.param) | `\(.evidence)`"] | join("\n"))' report_json.json \
              || echo "(no report_json.json found)"
          } > csp-details.md
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --search "ZAP security scan report in:title" --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body-file csp-details.md; fi
